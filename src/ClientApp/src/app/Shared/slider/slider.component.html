<div class="slider">
  <div class="prev">
    <button mat-icon-button [disabled]="!hasPrev()" (click)="prev()">
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>
  <div class="images">
    <div class="current-image">
      <img [src]="currentImageUrl()" alt="image">
    </div>
  </div>
  <div class="next">
    <button mat-icon-button [disabled]="!hasNext()" (click)="next()">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>
</div>
