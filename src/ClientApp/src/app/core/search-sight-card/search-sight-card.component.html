<mat-card>
  <img class="card-image" [src]="sight.sightPhotos.at(0)?.url" alt="sight image"/>
  <mat-card-header>
    <h3 class="card-title">{{sight.name}}</h3>
  </mat-card-header>
  <mat-card-content>
    <mat-chip-set>
      @for (tag of sight.tags; track tag.nameNormalized) {
        <mat-chip class="tag">{{tag.name}}</mat-chip>
      }
    </mat-chip-set>
  </mat-card-content>
  <mat-card-actions>
    <a mat-flat-button routerLink="/sight/{{sight.id}}" class="visit-button">Visit</a>
  </mat-card-actions>
</mat-card>
